<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CryptoBoy">
  <defs>
    <linearGradient id="shell" x1="8" y1="2" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e02848"/>
      <stop offset="0.55" stop-color="#c8102e"/>
      <stop offset="1" stop-color="#9e0c24"/>
    </linearGradient>
    <linearGradient id="face" x1="11" y1="8" x2="21" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5d878"/>
      <stop offset="0.55" stop-color="#e8c04a"/>
      <stop offset="1" stop-color="#a88828"/>
    </linearGradient>
  </defs>
  <!-- accent drop (matches menu preview shadow) -->
  <rect x="7" y="6" width="18" height="22" rx="4.5" fill="#d4b060"/>
  <!-- shell body -->
  <rect x="7" y="3" width="18" height="22" rx="4.5" fill="url(#shell)" stroke="#6e0818" stroke-width="0.75"/>
  <!-- inset lip -->
  <rect x="8.25" y="4.25" width="15.5" height="19.5" rx="3.5" fill="none" stroke="#f0d78c" stroke-opacity="0.45" stroke-width="0.75"/>
  <!-- status LED -->
  <circle cx="16" cy="6.2" r="1.15" fill="#ffd070"/>
  <circle cx="15.7" cy="5.9" r="0.35" fill="#fff6e8" fill-opacity="0.85"/>
  <!-- gold face / knob block -->
  <rect x="11" y="9" width="10" height="9" rx="2" fill="#000"/>
  <rect x="11.35" y="9.35" width="9.3" height="8.3" rx="1.7" fill="#fff"/>
  <rect x="11.7" y="9.7" width="8.6" height="7.6" rx="1.4" fill="url(#face)"/>
  <!-- knob mark -->
  <rect x="15.35" y="11.2" width="1.3" height="3.2" rx="0.65" fill="#4a3810"/>
  <circle cx="16" cy="16.2" r="1.55" fill="#c8a030"/>
  <circle cx="15.6" cy="15.85" r="0.45" fill="#fff0b0" fill-opacity="0.7"/>
</svg>
